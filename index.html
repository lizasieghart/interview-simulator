<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; overflow: hidden; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font: 13px/1 system-ui, sans-serif;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">move mouse · click to explode</div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');

    let W, H, particles = [], mouse = { x: -9999, y: -9999 };
    const COUNT = 600;
    const COLORS = ['#7b5ea7','#5e9dcc','#4fc3a1','#e07b7b','#e8c86f'];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor(x, y, burst) {
        this.reset(x, y, burst);
      }
      reset(x, y, burst) {
        this.x = x ?? Math.random() * W;
        this.y = y ?? Math.random() * H;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.r = burst ? Math.random() * 3 + 1 : Math.random() * 2 + 0.5;
        this.life = 1;
        this.decay = burst ? Math.random() * 0.015 + 0.008 : Math.random() * 0.003 + 0.001;
        const speed = burst ? Math.random() * 6 + 2 : Math.random() * 0.8 + 0.1;
        const angle = burst ? Math.random() * Math.PI * 2 : Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.burst = burst ?? false;
      }
      update() {
        // perlin-ish field force
        const nx = this.x / W * 4;
        const ny = this.y / H * 4;
        const angle = (Math.sin(nx + Date.now() * 0.0003) + Math.cos(ny + Date.now() * 0.0002)) * Math.PI;

        if (!this.burst) {
          this.vx += Math.cos(angle) * 0.04;
          this.vy += Math.sin(angle) * 0.04;
        }

        // mouse repulsion
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120 && dist > 0) {
          const force = (120 - dist) / 120;
          this.vx += (dx / dist) * force * 1.5;
          this.vy += (dy / dist) * force * 1.5;
        }

        // drag
        this.vx *= 0.97;
        this.vy *= 0.97;

        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;

        // wrap edges (non-burst only)
        if (!this.burst) {
          if (this.x < 0) this.x = W;
          if (this.x > W) this.x = 0;
          if (this.y < 0) this.y = H;
          if (this.y > H) this.y = 0;
          if (this.life < 0.1) this.reset();
        }
      }
      draw() {
        ctx.globalAlpha = this.life * 0.85;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      particles = Array.from({ length: COUNT }, () => new Particle());
    }

    function explode(x, y) {
      for (let i = 0; i < 80; i++) {
        particles.push(new Particle(x, y, true));
      }
    }

    let hintFaded = false;
    function loop() {
      requestAnimationFrame(loop);

      // soft trail
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;

      // draw connections
      ctx.lineWidth = 0.4;
      for (let i = 0; i < particles.length; i++) {
        const a = particles[i];
        for (let j = i + 1; j < particles.length; j++) {
          const b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = dx * dx + dy * dy;
          if (d < 3600) {
            const alpha = (1 - d / 3600) * 0.15 * a.life * b.life;
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = a.color;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      particles = particles.filter(p => p.life > 0);
      while (particles.filter(p => !p.burst).length < COUNT) {
        particles.push(new Particle());
      }

      particles.forEach(p => { p.update(); p.draw(); });

      if (!hintFaded) {
        hintFaded = true;
        setTimeout(() => hint.style.opacity = 0, 3000);
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('click', e => explode(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    });
    window.addEventListener('touchstart', e => explode(e.touches[0].clientX, e.touches[0].clientY));

    resize();
    init();
    loop();
  </script>
</body>
</html>
